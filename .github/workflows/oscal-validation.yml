name: OSCAL Validation

on:
  push:
    branches: [ main, add-171a-plan ]

jobs:
  validate-oscal:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent workflow from hanging indefinitely
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Setup OSCAL CLI
      uses: oscal-club/oscal-cli-action@v2.0.1
      with:
        args: --version
    
    # JSON Validation Steps (prioritize these - they work)
    - name: Validate Catalogs (JSON)
      timeout-minutes: 3
      run: |
        found=0
        for file in $(find . -name "*catalog*.json" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli catalog validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No JSON catalog files found. Skipping."
        fi
      continue-on-error: false
    
    - name: Validate Profiles (JSON)
      timeout-minutes: 3
      run: |
        found=0
        for file in $(find . -name "*profile*.json" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli profile validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No JSON profile files found. Skipping."
        fi
      continue-on-error: false
    
    # XML Validation Steps (with timeout protection)
    - name: Validate Catalogs (XML)
      timeout-minutes: 3
      run: |
        found=0
        for file in $(find . -name "*catalog*.xml" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            timeout 120s oscal-cli catalog validate "$file" || echo "Validation timed out or failed for $file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No XML catalog files found. Skipping."
        fi
      continue-on-error: true  # Don't fail build if XML validation hangs
    
    - name: Validate Profiles (XML)
      timeout-minutes: 3
      run: |
        found=0
        for file in $(find . -name "*profile*.xml" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            timeout 120s oscal-cli profile validate "$file" || echo "Validation timed out or failed for $file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No XML profile files found. Skipping."
        fi
      continue-on-error: true
    
    - name: Validate Assessment Plans
      timeout-minutes: 3
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*assessment-plan*.json') )
        if ((${#files[@]} == 0)); then
          echo "No assessment-plan files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false
    
    - name: Validate Assessment Results
      timeout-minutes: 3
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*assessment-results*.json') )
        if ((${#files[@]} == 0)); then
          echo "No assessment-results files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false
    
    - name: Validate POAMs
      timeout-minutes: 3
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*poam*.json') )
        if ((${#files[@]} == 0)); then
          echo "No POAM files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false