name: OSCAL Validation

on:
  push:
    branches: [ main, add-171a-plan ]

jobs:
  validate-oscal:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Setup OSCAL CLI
      uses: oscal-club/oscal-cli-action@v2.0.1
      with:
        args: --version
    
    # XML Validation Steps
    - name: Validate Catalogs (XML)
      run: |
        found=0
        for file in $(find . -name "*catalog*.xml" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli catalog validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No XML catalog files found. Skipping."
        fi
      continue-on-error: false
    
    - name: Validate Profiles (XML)
      run: |
        found=0
        for file in $(find . -name "*profile*.xml" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli profile validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No XML profile files found. Skipping."
        fi
      continue-on-error: false
    
    # JSON Validation Steps
    - name: Validate Catalogs (JSON)
      run: |
        found=0
        for file in $(find . -name "*catalog*.json" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli catalog validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No JSON catalog files found. Skipping."
        fi
      continue-on-error: false
    
    - name: Validate Profiles (JSON)
      run: |
        found=0
        for file in $(find . -name "*profile*.json" 2>/dev/null); do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            oscal-cli profile validate "$file"
            found=1
          fi
        done
        if [ $found -eq 0 ]; then
          echo "No JSON profile files found. Skipping."
        fi
      continue-on-error: false
    
    - name: Validate Assessment Plans
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*assessment-plan*.json' '*assessment-plan*.xml') )
        if ((${#files[@]} == 0)); then
          echo "No assessment-plan files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false
    
    - name: Validate Assessment Results
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*assessment-results*.json' '*assessment-results*.xml') )
        if ((${#files[@]} == 0)); then
          echo "No assessment-results files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false
    
    - name: Validate POAMs
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=( $(git ls-files '*poam*.json' '*poam*.xml') )
        if ((${#files[@]} == 0)); then
          echo "No POAM files found. Skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          echo "Validating: $file"
          oscal-cli validate "$file"
        done
      continue-on-error: false
